<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Active and Inactive Medical Filing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="900" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="810" cy="80" r="90" fill="#ccfbf1" opacity="0.55"/>
  <circle cx="90" cy="445" r="120" fill="#dbeafe" opacity="0.65"/>
  <text x="54" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Active and Inactive Medical Filing</text>
  <text x="54" y="100" font-family="Arial, sans-serif" font-size="17" fill="#475569">Records move from active custody to inactive storage according to policy and retention rules.</text>
