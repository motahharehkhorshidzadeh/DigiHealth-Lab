<rect x="84" y="145" width="330" height="250" rx="24" fill="#fff" stroke="#99f6e4"/>
<rect x="488" y="145" width="330" height="250" rx="24" fill="#fff" stroke="#bfdbfe"/>
<text x="250" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#0f766e">Active Files</text>
<text x="653" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#1d4ed8">Inactive Storage</text>
<g transform="translate(125,225)"><rect width="250" height="25" rx="8" fill="#14b8a6" opacity=".25"/><rect y="45" width="250" height="25" rx="8" fill="#14b8a6" opacity=".25"/><rect y="90" width="250" height="25" rx="8" fill="#14b8a6" opacity=".25"/><text x="125" y="155" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">recent care • frequent retrieval</text></g>
<g transform="translate(528,225)"><rect width="250" height="25" rx="8" fill="#60a5fa" opacity=".25"/><rect y="45" width="250" height="25" rx="8" fill="#60a5fa" opacity=".25"/><rect y="90" width="250" height="25" rx="8" fill="#60a5fa" opacity=".25"/><text x="125" y="155" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">low-use records • retention control</text></g>
