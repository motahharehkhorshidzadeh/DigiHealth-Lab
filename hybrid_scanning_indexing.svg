<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Hybrid Paper-Electronic Filing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="900" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="810" cy="80" r="90" fill="#ccfbf1" opacity="0.55"/>
  <circle cx="90" cy="445" r="120" fill="#dbeafe" opacity="0.65"/>
  <text x="54" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Hybrid Paper-Electronic Filing</text>
  <text x="54" y="100" font-family="Arial, sans-serif" font-size="17" fill="#475569">Paper documents are scanned, indexed and linked to the legal health record.</text>
  <g filter="url(#shadow)"><rect x="95" y="150" width="710" height="260" rx="26" fill="#fff" stroke="#bfdbfe"/>
<g transform="translate(145,220)"><rect width="145" height="110" rx="18" fill="#f0fdfa" stroke="#99f6e4"/><text x="72" y="46" text-anchor="middle" font-family="Arial" font-size="36">📄</text><text x="72" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Paper Form</text></g>
<g transform="translate(378,220)"><rect width="145" height="110" rx="18" fill="#eff6ff" stroke="#bfdbfe"/><text x="72" y="46" text-anchor="middle" font-family="Arial" font-size="36">🖨️</text><text x="72" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Scan & Index</text></g>
<g transform="translate(610,220)"><rect width="145" height="110" rx="18" fill="#ecfeff" stroke="#67e8f9"/><text x="72" y="46" text-anchor="middle" font-family="Arial" font-size="36">💻</text><text x="72" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">EHR Document</text></g>
<path d="M300 274 L368 274 M533 274 L600 274" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
<text x="450" y="365" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Index by patient ID, encounter, document type, author, date and final status.</text>
</g>
</svg>