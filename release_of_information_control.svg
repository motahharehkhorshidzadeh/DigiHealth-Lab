<g transform="translate(302,212)"><rect width="150" height="118" rx="18" fill="#f0fdfa" stroke="#99f6e4"/><text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="34">🪪</text><text x="75" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Identity/Auth</text></g>
<g transform="translate(476,212)"><rect width="150" height="118" rx="18" fill="#ecfeff" stroke="#67e8f9"/><text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="34">📋</text><text x="75" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Disclosure Log</text></g>
