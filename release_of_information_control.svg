  <text x="54" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Release of Information Control</text>
  <text x="54" y="100" font-family="Arial, sans-serif" font-size="17" fill="#475569">Disclosure requests require verification, authorization, logging and secure delivery.</text>
