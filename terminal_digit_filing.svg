<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Terminal Digit Filing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="900" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="810" cy="80" r="90" fill="#ccfbf1" opacity="0.55"/>
  <circle cx="90" cy="445" r="120" fill="#dbeafe" opacity="0.65"/>
  <text x="54" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Terminal Digit Filing</text>
  <text x="54" y="100" font-family="Arial, sans-serif" font-size="17" fill="#475569">Large hospitals use terminal digit groups to distribute filing workload evenly.</text>
  <g filter="url(#shadow)"><rect x="95" y="155" width="710" height="255" rx="24" fill="#fff" stroke="#bfdbfe"/>
<text x="142" y="210" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a">MRN: 12 - 34 - 56</text>
<g transform="translate(145,250)"><rect width="150" height="105" rx="18" fill="#e0f2fe" stroke="#7dd3fc"/><text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#0369a1">12</text><text x="75" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">tertiary</text></g>
<g transform="translate(370,250)"><rect width="150" height="105" rx="18" fill="#dcfce7" stroke="#86efac"/><text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#15803d">34</text><text x="75" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">secondary</text></g>
<g transform="translate(595,250)"><rect width="150" height="105" rx="18" fill="#ccfbf1" stroke="#2dd4bf"/><text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#0f766e">56</text><text x="75" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">primary filing group</text></g>
<path d="M535 300 L580 300" stroke="#0f766e" stroke-width="5" marker-end="url(#arr)"/>
</g><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/></marker></defs>
</svg>